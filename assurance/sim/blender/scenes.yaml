# Hazard scenes for Blender (assurance/sim/blender): one per hazard of WP-C-03 that a picture helps review, with the
# package's rating (WP-C-03 §5, not yet re-rated for OE-1) and the safety functions WP-C-04 allocates to it.
# export_scene.py checks every reference against trace/items/hazards.yaml and writes out/<id>/scene.json;
# render_scene.py poses upstream's CAD at the key frames; compose.py draws the dashboard. Pictures only: synthetic,
# no evidence credit (../README.md §4).
#
#   id          scene ID (output folder)
#   hz          the hazard pictured (trace/items/hazards.yaml); related: other hazards the same picture shows
#   rating      s, f, p, plr, cat as WP-C-03 §5 rates it (the package's rating); oe: envelopes it applies to
#   sf          the safety functions WP-C-03 allocates (checked against hazards.yaml)
#   stops       what would stop it at BL-001 (upstream as assessed): the function and its state there
#   pose        six joint angles (deg, arm_model.py conventions; 0 = as modelled) before the motion; opening: gripper mm
#   motion      kind: joint_sweep (joint, from, to, rate_dps), gripper_close (from, to, rate_mms), drop (height from
#               the bench, the payload falls from t = 0), static (one pose; the frames repeat it)
#               All rates are assumptions named in the caption: upstream declares no joint speeds (GAP-10218-03) and
#               DQ-016 (speed caps per mode) is open.
#   gap         a joint whose link-to-link gap is plotted against the ISO 13854 minimum gaps (clauses to be checked)
#   track       a point on the person whose distance to the arm is plotted: {point: hand | head, to: tcp | <group>}
#   person      figure (male | female, library/people/), at [x, y, z] feet (m, scene frame), yaw (deg, 0 faces -Y),
#               pose (reach | lean | stand), lean and head_tilt (deg), hand / hand_l: {at: joint:J3 | tcp | [x, y, z], offset: [dx, dy, dz]}
#               head: {at: ...} the head position used by `track` (the figure's own head is drawn where the rig puts it)
#   views       cameras to render (render_scene.VIEWS or `cameras` below); main: the dashboard's large view
#   cameras     scene cameras: loc, target (m; or joint:J3 / tcp, resolved at export), lens
#   window      seconds around the trigger (t = 0) to show; frames: extra times to render
#   status      rendered (dashboard committed in dashboards/) or catalogued (scene file only; render pending)
schema_version: 1
iso_13854_mm: {finger: 25, hand: 100, arm: 120, body: 500}   # minimum gaps to avoid crushing, to be checked
scenes:
  # ----------------------------------------------------------------------------------- mechanical, hand-guiding
  - id: hz-m01-elbow-pinch-teach
    hz: HZ-M01
    related: [HZ-P03, HZ-M05]
    title: "Elbow closes on the operator's fingers while hand-guiding in TEACH"
    situation: >-
      The operator hand-guides the arm in TEACH (IS-02, WP-C-06): one hand on the forearm near the wrist, the other
      on the upper arm with the fingers in the elbow opening. They fold the elbow to park the arm.
    effect: >-
      The gap between the forearm and upper-arm covers closes through the ISO 13854 finger gap with the fingers inside;
      the actuator holds 25 % torque in TEACH and nothing at BL-001 detects the contact.
    rating: {s: S2, f: F2, p: P2, plr: e, cat: 4, oe: All}
    mode: "M-03 TEACH, 25 % torque and speed (SF-03)"
    envelope: "OE-1, fixtured bench, operator only"
    sf: [SF-03, SF-04]
    stops:
      - {sf: SF-32, name: emergency stop (pendant), state: does not exist}
      - {sf: SF-04, name: collision detection by torque estimation, state: does not exist}
      - {sf: SF-03, name: joint torque and speed limit (TEACH 25 %), state: firmware clamp, not verified}
      - {sf: DM-02, name: joint gaps per ISO 13854, state: not verified (GAP-01)}
    pose: [0, 50, 110, -40, 0, 0]
    opening: 0
    motion: {kind: joint_sweep, joint: J3, from: 110, to: 5, rate_dps: 30, t0: 0.0}
    gap: J3
    person: {figure: male, at: [0.55, 0.62, -0.9], yaw: 200, pose: lean,
             hand: {at: "joint:J3", offset: [0.0, -0.07, 0.03]}, hand_l: {at: tcp, offset: [0.0, -0.05, 0.0]}}
    views: [elbow, scene, top]
    main: elbow
    cameras:
      elbow: {loc: [0.62, -0.55, 0.42], target: "joint:J3", lens: 70}
    window: [-1.0, 4.0]
    caption: >-
      Kinematic: the elbow folds at 30 °/s (an assumed hand-guiding rate; DQ-016 is open) from 110° to 5° (the assumed software limit). The gap
      is the smallest distance between the upper-arm and forearm bodies away from the actuator, from the CAD; the
      fingers are not modelled, the figure only shows where they are.
    change: >-
      What would change it: an ISO 13854 finger gap by design at the elbow (DM-02, GAP-01), a current-based contact
      stop on the elbow actuator (SF-04), or a hand-guiding rule that keeps both hands on the forearm (WP-C-06 HR).
    status: catalogued

  - id: hz-m02-gripper-finger-teach
    hz: HZ-M02
    related: [HZ-P03, HZ-M07]
    title: "Gripper closes on the operator's finger between the jaws in TEACH"
    situation: >-
      The operator adjusts an object between the open jaws during TEACH; a leader-arm trigger or a replayed command
      closes the gripper.
    effect: >-
      The jaw opening passes the ISO 13854 finger gap with the finger inside; the gripper actuator's current limit is
      the only backstop at BL-001.
    rating: {s: S2, f: F1, p: P2, plr: d, cat: 3, oe: All}
    mode: "M-03 TEACH, 25 % speed cap"
    envelope: "OE-1, fixtured bench, operator only"
    sf: [SF-04, SF-13]
    stops:
      - {sf: SF-32, name: emergency stop (pendant), state: does not exist}
      - {sf: SF-04, name: collision detection by torque estimation, state: does not exist}
      - {sf: SF-13, name: gripper holding on power loss, state: unknown}
      - {sf: "—", name: actuator's own current limit, state: backstop only}
    pose: [0, 0, 0, 0, 0, 0]
    opening: 64
    motion: {kind: gripper_close, from: 64, to: 4, rate_mms: 30, t0: 0.0}
    gap_limits: [finger]
    person: {figure: male, at: [-0.30, 0.50, -0.9], yaw: 0, pose: reach, hand: {at: tcp, offset: [0.0, 0.0, 0.03]}}
    views: [hand, scene, top]
    main: hand
    window: [-1.0, 3.0]
    caption: >-
      Kinematic: the jaws close at 30 mm/s (assumed; DQ-016) from 64 mm to 4 mm. The arm holds the as-modelled pose.
      The finger is not modelled; the operator figure shows where it is.
    change: >-
      What would change it: a gripper force limit bound to the actuator current (SF-03 on the gripper), a TEACH rule
      that the gripper never closes on a trigger while hand-guiding (WP-C-06 HR), or a finger geometry that keeps a
      25 mm stop (DM-02).
    status: catalogued

  - id: hz-p03-wrist-against-bench
    hz: HZ-P03
    related: [HZ-M01]
    title: "Wrist pitch traps a finger between the gripper and the bench top"
    situation: >-
      In TEACH the operator steadies an object on the bench under the gripper; the wrist pitches down and the gripper
      body closes on the hand against the bench (an external surface, the package's HZ-P03).
    effect: >-
      The height of the gripper above the bench passes the ISO 13854 hand and finger gaps with the hand under it.
    rating: {s: S2, f: F2, p: P2, plr: e, cat: 4, oe: OE-2..4}
    mode: "M-03 TEACH, 25 % torque and speed (SF-03)"
    envelope: "OE-1 shown; rated for OE-2 and above"
    sf: [SF-03, SF-04]
    stops:
      - {sf: SF-32, name: emergency stop (pendant), state: does not exist}
      - {sf: SF-04, name: collision detection by torque estimation, state: does not exist}
      - {sf: SF-03, name: joint torque and speed limit (TEACH 25 %), state: firmware clamp, not verified}
    pose: [0, 100, 100, -65, 0, 0]
    opening: 40
    motion: {kind: joint_sweep, joint: J3, from: 100, to: 45, rate_dps: 30, t0: 0.0}
    surface: {group: Gripper, plane_z_mm: 0.0, label: "gripper above the bench"}
    person: {figure: female, at: [-0.40, -0.72, -0.9], yaw: 180, pose: reach, hand: {at: [-0.33, -0.06, 0.03]}}
    views: [hand, scene, top]
    main: hand
    cameras:
      hand: {loc: [-0.95, -0.60, 0.32], target: [-0.33, -0.03, 0.10], lens: 60}
    window: [-1.0, 3.0]
    caption: >-
      Kinematic: the elbow closes at 30 °/s (assumed) from 100° to 45° with the shoulder at 100° and the wrist at
      -65°, so the gripper comes straight down onto the bench. The height is the lowest point of the gripper body above the bench
      plane, from the CAD. The hand is not modelled.
    change: >-
      What would change it: a workspace floor in the controller (a software limit on the TCP height, SF-29 extended to
      Cartesian limits), SF-04, or the hand-guiding rule of WP-C-06.
    status: catalogued

  # ----------------------------------------------------------------------------------- mechanical, RUN
  - id: hz-m04-sweep-strike-run
    hz: HZ-M04
    related: [HZ-P02, HZ-P01]
    title: "Arm sweeps into a bystander's head during RUN"
    situation: >-
      A bystander leans in over the bench edge to look at the gripper while a demonstration runs (MU-01 on the
      operator's side: a person inside the 650 mm reach, OE-2 and above).
    effect: >-
      The gripper sweeps at RUN speed through the space where the head is; the arm has no perception of the person
      and no contact stop at BL-001.
    rating: {s: S2, f: F2, p: P2, plr: e, cat: 4, oe: OE-2..4}
    mode: "M-04 RUN, demo speed (50 % cap, assumed)"
    envelope: "OE-2 classroom (excluded from the first case; shown for the rating)"
    sf: [SF-03, SF-06, SF-15]
    stops:
      - {sf: SF-32, name: emergency stop (pendant), state: does not exist}
      - {sf: SF-06, name: reduced speed in the shared workspace, state: does not exist}
      - {sf: SF-15, name: motion-imminent annunciation, state: does not exist}
      - {sf: SF-04, name: collision detection by torque estimation, state: does not exist}
    pose: [-45, 40, 40, 0, 0, 0]
    opening: 20
    motion: {kind: joint_sweep, joint: J1, from: -45, to: 60, rate_dps: 90, t0: 0.0}
    track: {point: head, to: tcp}
    person: {figure: female, at: [-0.30, -0.80, -0.9], yaw: 180, pose: stand, lean: 32, head: {at: [-0.315, -0.067, 0.365]}}
    views: [scene, front, top]
    main: scene
    cameras:
      scene: {loc: [1.2, -1.2, 0.7], target: [-0.2, -0.1, 0.3], lens: 40}
    window: [-1.0, 2.5]
    caption: >-
      Kinematic: the base sweeps at 90 °/s (assumed demo speed: half of a 180 °/s joint cap; DQ-016 is open) through
      105°. The distance plotted is from the head point to the finger tips, from the CAD kinematics. The head point is placed by
      the scene; the figure shows the posture.
    change: >-
      What would change it: a marked area and reduced speed when a person may be in reach (SF-06, WP-C-02 §6), the
      warning before motion (SF-15), and the emergency stop in the operator's hand (SF-32).
    status: catalogued

  - id: hz-p02-hand-reach-in-run
    hz: HZ-P02
    related: [HZ-M04]
    title: "Operator reaches in to catch a fumbled object during RUN"
    situation: >-
      A policy run fumbles an object; the operator reaches in to catch it (MU-01, IS-04) as the arm moves toward the
      same point at RUN speed.
    effect: >-
      The gripper reaches the hand at the arm's speed: the transient contact of ISO/TS 15066 (280 N for the hand, not
      claimed) with nothing to limit the force at BL-001.
    rating: {s: S2, f: F2, p: P2, plr: e, cat: 4, oe: OE-3..4}
    mode: "M-04 RUN, demo speed (50 % cap, assumed)"
    envelope: "OE-1 shown; rated for OE-3 and above"
    sf: [SF-01, SF-02, SF-23]
    stops:
      - {sf: SF-32, name: emergency stop (pendant), state: does not exist}
      - {sf: SF-02, name: contact-force stop, state: does not exist}
      - {sf: SF-23, name: trajectory jerk limit, state: does not exist}
    pose: [0, 95, 100, 50, 0, 0]
    opening: 40
    motion: {kind: joint_sweep, joint: J3, from: 100, to: 45, rate_dps: 90, t0: 0.0}
    track: {point: hand, to: tcp}
    person: {figure: male, at: [-1.0, 0.0, -0.9], yaw: 90, pose: reach, hand: {at: [-0.50, 0.0, 0.25]}}
    views: [scene, front, top]
    main: scene
    cameras:
      scene: {loc: [1.2, -1.2, 0.7], target: [-0.3, -0.1, 0.3], lens: 40}
    window: [-1.0, 2.0]
    caption: >-
      Kinematic: the elbow closes at 90 °/s (assumed) from 100° to 45° toward the hand point; the speed plotted is the
      finger-tip speed from the CAD kinematics. No force is modelled.
    change: >-
      What would change it: a speed cap when a person is in reach (SF-06), a contact-force stop (SF-02, cat. 3), the
      training rule never to reach in (MU-01), and SF-32 in the operator's hand.
    status: catalogued

  - id: hz-m06-tip-over-unfixtured
    hz: HZ-M06
    related: []
    title: "Unfixtured base tips under the arm's own moment at full reach"
    situation: >-
      The base is set on the bench without the clamps (GAP-03: the fixing is undocumented) and the arm extends with a
      1.5 kg payload to full reach.
    effect: >-
      About 22 N·m of moment on a 140 mm by 200 mm plate; the base tips toward the operator with the arm and payload.
    rating: {s: S1, f: F1, p: P1, plr: a, cat: B, oe: All}
    mode: "M-04 RUN"
    envelope: "OE-1"
    sf: []
    stops:
      - {sf: IFU-01, name: fixing instruction (information for use), state: does not exist (GAP-03)}
      - {sf: DM-07, name: base fixing by design, state: proposed}
    pose: [0, 0, 180, 0, 0, 0]
    opening: 40
    fixtured: false
    payload: {size: [0.05, 0.05, 0.05], mass_kg: 1.5}
    motion: {kind: static}
    person: {figure: male, at: [-0.35, 0.65, -0.9], yaw: 0, pose: stand}
    views: [front, scene, top]
    main: front
    cameras:
      front: {loc: [0.35, -1.25, 0.30], target: [0.25, 0.0, 0.18], lens: 50}
    window: [0.0, 1.0]
    caption: >-
      Static: the arm straight out (J3 at 180°, past the assumed limit, drawn to show the worst moment arm); the
      payload cube is illustrative. The moment is the package's figure (4.5 kg arm, 1.5 kg at 650 mm, about 22 N·m);
      the tipping edge is the plate's -X edge at 70 mm from the J1 axis.
    change: "What would change it: DM-07 (fixing by design) and IFU-01 (fixing instruction), both proposed in WP-C-03 §6."
    status: catalogued

  - id: hz-m07-payload-drop-power-loss
    hz: HZ-M07
    related: [HZ-M06]
    title: "Gripper releases the payload when motor power is removed"
    situation: >-
      The emergency stop or a safe stop removes motor power (SF-32, SF-08) while the gripper carries a 1.5 kg object
      over the bench edge where the operator stands.
    effect: >-
      If the gripper is back-drivable without power (SF-13 unknown at BL-001), the object falls 0.35 m onto the hand or
      foot.
    rating: {s: S1, f: F2, p: P1, plr: b, cat: 1, oe: All}
    mode: "M-04 RUN, then M-01 OFF"
    envelope: "OE-1"
    sf: [SF-08, SF-13]
    stops:
      - {sf: SF-13, name: gripper holding on power loss, state: unknown (to test, WP-V-02)}
      - {sf: SF-08, name: safe stop on watchdog timeout, state: does not exist}
    pose: [75, 100, 100, 90, 180, 0]
    opening: 50
    payload: {size: [0.05, 0.05, 0.05], mass_kg: 1.5}
    motion: {kind: drop, t0: 0.0}
    person: {figure: female, at: [-0.08, -0.78, -0.9], yaw: 180, pose: reach, hand: {at: tcp, offset: [0.0, -0.02, -0.33]}}
    cameras:
      scene: {loc: [1.1, -1.3, 0.6], target: [-0.1, -0.2, 0.2], lens: 45}
      front: {loc: [-1.25, -0.55, 0.35], target: [-0.1, -0.2, 0.15], lens: 50}
    views: [scene, front, top]
    main: scene
    window: [-0.5, 1.0]
    caption: >-
      Kinematic: power is removed at t = 0 and the payload cube (illustrative) falls freely from the gripper; the arm
      holds its pose (the actuators' holding behaviour without power is itself unknown, GAP-06).
    change: "What would change it: SF-13 shown by test (WP-V-02), or a holding brake on the gripper actuator."
    status: catalogued

  # ----------------------------------------------------------------------------------- collaborative, restart, control
  - id: hz-p04-auto-restart-in-envelope
    hz: HZ-P04
    related: [HZ-M04]
    title: "Power returns and the arm resumes with the operator inside the reach envelope"
    situation: >-
      After an emergency stop the operator steps in to clear the bench; power is restored at the PSU and the host
      replays the queued trajectory without a reset (no SF-24 at BL-001).
    effect: >-
      The arm starts from its held pose at RUN speed with the operator inside reach and no warning.
    rating: {s: S2, f: F1, p: P2, plr: d, cat: 3, oe: OE-2..4}
    mode: "M-01 OFF, then M-04 RUN without a reset"
    envelope: "OE-1 shown; rated for OE-2 and above"
    sf: [SF-24]
    stops:
      - {sf: SF-24, name: manual reset after a stop, state: does not exist}
      - {sf: SF-15, name: motion-imminent annunciation, state: does not exist}
      - {sf: SF-32, name: emergency stop (pendant), state: does not exist}
    pose: [30, 40, 40, 0, 0, 0]
    opening: 20
    motion: {kind: joint_sweep, joint: J1, from: 30, to: -60, rate_dps: 90, t0: 0.5}
    track: {point: hand, to: tcp}
    person: {figure: male, at: [-0.30, -0.80, -0.9], yaw: 180, pose: reach, hand: {at: [-0.315, -0.067, 0.34]}}
    cameras:
      scene: {loc: [1.2, -1.2, 0.7], target: [-0.2, -0.1, 0.3], lens: 40}
    views: [scene, front, top]
    main: scene
    window: [-1.0, 2.0]
    caption: >-
      Kinematic: power returns at t = 0 and the base sweeps at 90 °/s (assumed) from +0.5 s; the hand point is where
      the operator is clearing the bench. The distance plotted is from the hand point to the finger tips.
    change: "What would change it: SF-24 (manual reset, cat. 3, PLr d) and SF-15 (warning before motion)."
    status: catalogued

  - id: hz-c05-joint-limit-overshoot
    hz: HZ-C05
    related: [HZ-C07]
    title: "A position command past the software limit drives the elbow into its end-stop"
    situation: >-
      A trajectory from the host commands the elbow past the assumed software limit; with no clamp at BL-001 the
      actuator drives to the mechanical end-stop (the printed limit blocks).
    effect: >-
      The forearm closes fully onto the upper arm at RUN speed: the link gap of HZ-M01 at RUN speed, and the end-stop
      takes the actuator's stall torque.
    rating: {s: S1, f: F2, p: P2, plr: c, cat: 2, oe: OE-2..4}
    mode: "M-04 RUN"
    envelope: "OE-1"
    sf: [SF-29]
    stops:
      - {sf: SF-29, name: software joint limits (5° inboard of the end-stops), state: not declared (GAP-10218-03)}
      - {sf: DM-06, name: mechanical end-stops, state: printed limit blocks, strength not analysed}
    pose: [0, 40, 60, -20, 0, 0]
    opening: 0
    motion: {kind: joint_sweep, joint: J3, from: 60, to: 0, rate_dps: 120, t0: 0.0}
    gap: J3
    views: [elbow, scene, top]
    main: elbow
    cameras:
      elbow: {loc: [0.62, -0.55, 0.42], target: "joint:J3", lens: 70}
    window: [-0.5, 1.5]
    caption: >-
      Kinematic: the elbow closes at 120 °/s (assumed RUN rate) from 60° to the modelled 0°; the assumed software limit
      is 5° and the end-stop 0° (upstream declares neither).
    change: "What would change it: SF-29 at the controller safety layer and the end-stop strength analysis (WP-H-10)."
    status: catalogued

  - id: hz-c01-topic-stall-last-cmd-hold
    hz: HZ-C01
    related: [HZ-C04]
    title: "The ROS topic stalls in RUN and the joints hold the last velocity command"
    situation: >-
      The host's trajectory topic stops mid-motion (a stalled node, HZ-C04); the driver keeps the last command and the
      joint keeps moving at its last velocity until the end-stop or a person.
    effect: >-
      No watchdog at BL-001: the elbow continues to close at the commanded rate past the intended stop angle.
    rating: {s: S2, f: F2, p: P2, plr: e, cat: 4, oe: All}
    mode: "M-04 RUN"
    envelope: "OE-1"
    sf: [SF-08, SF-25]
    stops:
      - {sf: SF-08, name: safe stop on watchdog timeout (250 ms), state: does not exist}
      - {sf: SF-25, name: heartbeat and deadline monitor, state: does not exist}
    pose: [0, 45, 120, -30, 0, 0]
    opening: 0
    motion: {kind: joint_sweep, joint: J3, from: 120, to: 0, rate_dps: 60, t0: 0.0, intended_stop_deg: 80}
    gap: J3
    views: [elbow, scene, top]
    main: elbow
    cameras:
      elbow: {loc: [0.62, -0.55, 0.42], target: "joint:J3", lens: 70}
    window: [-0.5, 2.5]
    caption: >-
      Kinematic: the topic stalls at t = 0 with the elbow closing at 60 °/s (assumed); the intended stop was 80°; with
      SF-08 the motion would end 250 ms after the stall (drawn as a marker), without it the elbow runs to the end-stop.
    change: "What would change it: SF-08 and SF-25 in the controller safety layer (DQ-020)."
    status: catalogued

  - id: hz-m05-entanglement-joint-axis
    hz: HZ-M05
    related: [HZ-M01]
    title: "Hair or a lanyard winds onto the wrist roll axis"
    situation: >-
      A student leans over the wrist during a demonstration (OE-2); long hair or a lanyard reaches the rotating tool
      roll joint between the wrist and the gripper.
    effect: >-
      The roll joint turns continuously; a drawn-in strand winds onto the joint with the actuator's torque behind it.
    rating: {s: S2, f: F1, p: P2, plr: d, cat: 3, oe: OE-2..4}
    mode: "M-04 RUN"
    envelope: "OE-2 (excluded from the first case; shown for the rating)"
    sf: []
    stops:
      - {sf: DM-02, name: joint gaps and guarded axes, state: not verified (GAP-01)}
      - {sf: SF-04, name: collision detection by torque estimation, state: does not exist}
    pose: [0, 35, 25, 10, 0, 0]
    opening: 20
    motion: {kind: joint_sweep, joint: J6, from: 0, to: 360, rate_dps: 120, t0: 0.0}
    person: {figure: female, at: [-0.15, -0.78, -0.9], yaw: 180, pose: stand, lean: 35, head: {at: "joint:J6", offset: [0.0, -0.07, 0.06]}}
    track: {point: head, to: Link6}
    views: [scene, hand, top]
    main: scene
    cameras:
      scene: {loc: [1.1, -1.2, 0.65], target: [-0.15, -0.15, 0.3], lens: 45}
      hand: {loc: [-0.75, -0.95, 0.55], target: "joint:J6", lens: 60}
    window: [-0.5, 3.0]
    caption: >-
      Kinematic: the tool roll turns one full turn at 120 °/s (assumed). The hair is not modelled; the distance plotted
      is from the head point to the wrist body.
    change: "What would change it: a guard over the roll joint's gap (DM-02) and the marked area of WP-C-02 §6."
    status: catalogued

  - id: hz-p01-head-quasi-static
    hz: HZ-P01
    related: [HZ-M04]

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">reBot-DevArm assurance: Open desktop manipulation. Engineered for safety.</title>
  <desc id="hero-d">reBot-DevArm assurance banner: a geometric six-axis desktop arm in amber on a clamped bench with a wrist camera, a red pendant emergency stop and a dashed reach envelope on a perspective floor grid, beside the project name and the tagline Open desktop manipulation. Engineered for safety. Chips name the standards: ISO 12100, ISO 10218-1/-2, ISO/TS 15066, ISO 13849-1, EN 60204-1, IEC 62443, Machinery Reg. (EU) 2023/1230.</desc>

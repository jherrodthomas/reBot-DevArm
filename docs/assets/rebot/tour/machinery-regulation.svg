<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t-machinery-regulation d-machinery-regulation" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-machinery-regulation">From essential requirements to the CE mark</title><desc id="d-machinery-regulation">A timeline: in force on 19 July 2023, applies from 20 January 2027 when the Machinery Directive is repealed. Then the route a manufacturer follows: the essential health and safety requirements of Annex III, a documented risk assessment, the technical documentation of Annex IV, conformity assessment, the EU declaration of conformity of Annex V, and CE marking before the machine is placed on the market. Two routes through conformity assessment: internal control, Module A, applying harmonised standards; or a notified body, required for the machinery listed in Annex I Part A, which includes safety functions with self-evolving behaviour from machine learning.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.76%{opacity:0}3.82%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a1{animation:a1 17s linear infinite;}@keyframes a2{0%,7.06%{opacity:0}9.12%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a2{animation:a2 17s linear infinite;}@keyframes a3{0%,12.35%{opacity:0}14.41%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a3{animation:a3 17s linear infinite;}@keyframes a4{0%,17.65%{opacity:0}19.71%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a4{animation:a4 17s linear infinite;}@keyframes a5{0%,22.94%{opacity:0}25.00%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a5{animation:a5 17s linear infinite;}@keyframes a6{0%,28.24%{opacity:0}30.29%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a6{animation:a6 17s linear infinite;}@keyframes a7{0%,33.53%{opacity:0}35.59%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a7{animation:a7 17s linear infinite;}@keyframes a8{0%,9.41%{opacity:0}11.47%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a8{animation:a8 17s linear infinite;}@keyframes a9{0%,14.71%{opacity:0}16.76%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a9{animation:a9 17s linear infinite;}@keyframes a10{0%,20.00%{opacity:0}22.06%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a10{animation:a10 17s linear infinite;}@keyframes a11{0%,25.29%{opacity:0}27.35%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a11{animation:a11 17s linear infinite;}@keyframes a12{0%,30.59%{opacity:0}32.65%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a12{animation:a12 17s linear infinite;}@keyframes a13{0%{transform:translate(175.0px,262.0px)}40.00%{transform:translate(175.0px,262.0px)}43.53%{transform:translate(480.0px,262.0px)}47.06%{transform:translate(785.0px,262.0px)}50.59%{transform:translate(785.0px,390.0px)}54.12%{transform:translate(480.0px,390.0px)}57.65%{transform:translate(175.0px,390.0px)}100%{transform:translate(175.0px,390.0px)}}.a13{animation:a13 17s linear infinite;transform:translate(175.0px,390.0px);}@keyframes a14{0%,38.82%{opacity:0}40.88%,61.18%{opacity:1}63.24%,100%{opacity:0}}.a14{animation:a14 17s linear infinite;opacity:0;}@keyframes a15{0%,63.53%{opacity:0}65.59%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a15{animation:a15 17s linear infinite;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.0" y="0.0" width="960.0" height="660.0" rx="0" fill="#FFFFFF"/><text x="28.0" y="34.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.2">REGULATION (EU) 2023/1230 · THE MACHINERY REGULATION</text><text x="28.0" y="66.0" font-size="26" fill="#122026" font-weight="700" text-anchor="start">From essential requirements to the CE mark</text><g class="a1"><line x1="60.0" y1="132.0" x2="900.0" y2="132.0" stroke="#B9CFD4" stroke-width="6" stroke-linecap="round"/><circle cx="90.0" cy="132.0" r="11" fill="#1E4752"/><text x="90.0" y="110.0" font-size="17" fill="#122026" font-weight="700" text-anchor="start">19 July 2023</text><text x="90.0" y="166.0" font-size="15" fill="#4E6A73" font-weight="600" text-anchor="start">in force</text><circle cx="520.0" cy="132.0" r="11" fill="#1E4752"/><text x="520.0" y="110.0" font-size="17" fill="#122026" font-weight="700" text-anchor="middle">20 January 2027</text><text x="520.0" y="166.0" font-size="15" fill="#4E6A73" font-weight="600" text-anchor="middle">applies; the Machinery Directive is repealed</text></g><g class="a2"><rect x="30.0" y="214.0" width="290.0" height="96.0" rx="12" fill="#E8F0F2"/><text x="46.0" y="246.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">Annex III</text><text x="46.0" y="274.0" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="start">Essential health and safety</text><text x="46.0" y="293.4" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="start">requirements</text></g><g class="a3"><rect x="335.0" y="214.0" width="290.0" height="96.0" rx="12" fill="#E8F0F2"/><text x="351.0" y="246.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">Risk assessment</text><text x="351.0" y="274.0" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="start">the manufacturer's, documented</text></g><g class="a4"><rect x="640.0" y="214.0" width="290.0" height="96.0" rx="12" fill="#E8F0F2"/><text x="656.0" y="246.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">Annex IV</text><text x="656.0" y="274.0" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="start">Technical documentation</text></g><g class="a5"><rect x="640.0" y="342.0" width="290.0" height="96.0" rx="12" fill="#FBF3E3"/><text x="656.0" y="374.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">Conformity assessment</text><text x="656.0" y="402.0" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="start">internal control, or a notified</text><text x="656.0" y="421.4" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="start">body</text></g><g class="a6"><rect x="335.0" y="342.0" width="290.0" height="96.0" rx="12" fill="#E8F0F2"/><text x="351.0" y="374.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">Annex V</text><text x="351.0" y="402.0" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="start">EU declaration of conformity</text></g><g class="a7"><rect x="30.0" y="342.0" width="290.0" height="96.0" rx="12" fill="#E8F0F2"/><text x="46.0" y="374.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">CE marking</text><text x="46.0" y="402.0" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="start">then it may be placed on the</text><text x="46.0" y="421.4" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="start">market</text></g><g class="a8"><line x1="320.0" y1="262.0" x2="333.0" y2="262.0" stroke="#4E6A73" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/></g><g class="a9"><line x1="625.0" y1="262.0" x2="638.0" y2="262.0" stroke="#4E6A73" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/></g><g class="a10"><line x1="785.0" y1="312.0" x2="785.0" y2="340.0" stroke="#4E6A73" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/></g><g class="a11"><line x1="638.0" y1="390.0" x2="627.0" y2="390.0" stroke="#4E6A73" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/></g><g class="a12"><line x1="333.0" y1="390.0" x2="322.0" y2="390.0" stroke="#4E6A73" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/></g><g class="a14"><g class="a13"><circle cx="0.0" cy="0.0" r="11" fill="#F2A33A" stroke="#FFFFFF" stroke-width="3"/></g></g><g class="a15"><rect x="30.0" y="474.0" width="900.0" height="128.0" rx="12" fill="#F4F3EF"/><text x="48.0" y="504.0" font-size="13.5" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.1">TWO ROUTES THROUGH CONFORMITY ASSESSMENT</text><text x="48.0" y="536.0" font-size="17" fill="#122026" font-weight="700" text-anchor="start">Internal control (Module A):</text><text x="300.0" y="536.0" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">the manufacturer checks and declares, applying harmonised standards</text><text x="48.0" y="568.0" font-size="17" fill="#122026" font-weight="700" text-anchor="start">A notified body:</text><text x="300.0" y="568.0" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">required for the machinery listed in Annex I Part A, which includes</text><text x="300.0" y="590.0" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">safety functions with self-evolving behaviour from machine learning</text></g><text x="480.0" y="646.0" font-size="12.5" fill="#4E6A73" font-weight="400" text-anchor="middle">Explains the standard's idea, not a claim about the arm · clause references to be checked · tools/wiki/tour_figures.py</text></svg>

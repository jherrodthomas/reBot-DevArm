<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t-iso-13857 d-iso-13857" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-13857">Keep the hazard out of reach: over a structure or through an opening</title><desc id="d-iso-13857">Left, side view of a person reaching over a protective structure towards a hazard: a is the height of the hazard, b the height of the structure, c the horizontal distance from the structure to the hazard; the reach curves over the structure and stops short of the hazard. Right, a hand reaching through an opening e in a guard: the smaller the opening, the less fits through it and the shorter the safety distance sr behind it. The standard's tables give a, b, c and sr by risk.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.33%{opacity:0}3.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a1{animation:a1 15s linear infinite;}@keyframes a2{0%,6.67%{opacity:0}9.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a2{animation:a2 15s linear infinite;}@keyframes a3{0%,13.33%{opacity:0}15.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a3{animation:a3 15s linear infinite;}@keyframes a4{0%,22.67%{opacity:0}25.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a4{animation:a4 15s linear infinite;}@keyframes a5{0%,28.00%{opacity:0}30.33%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a5{animation:a5 15s linear infinite;}@keyframes a6{0%,40.00%{opacity:0}42.33%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a6{animation:a6 15s linear infinite;}@keyframes a7{0%{transform:translate(-80.0px,0.0px)}44.00%{transform:translate(-80.0px,0.0px)}54.67%{transform:translate(0.0px,0.0px)}100%{transform:translate(0.0px,0.0px)}}.a7{animation:a7 15s linear infinite;transform:translate(0.0px,0.0px);}@keyframes a8{0%,42.67%{opacity:0}45.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a8{animation:a8 15s linear infinite;}@keyframes a9{0%,57.33%{opacity:0}59.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a9{animation:a9 15s linear infinite;}@keyframes a10{0%,62.67%{opacity:0}65.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a10{animation:a10 15s linear infinite;}@keyframes a11{0%,70.67%{opacity:0}73.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a11{animation:a11 15s linear infinite;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.0" y="0.0" width="960.0" height="620.0" rx="0" fill="#FFFFFF"/><text x="28.0" y="34.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.2">ISO 13857 · SAFETY DISTANCES</text><text x="28.0" y="66.0" font-size="26" fill="#122026" font-weight="700" text-anchor="start">Keep the hazard out of reach: over a structure or through an opening</text><g class="a1"><line x1="30.0" y1="520.0" x2="470.0" y2="520.0" stroke="#4E6A73" stroke-width="3" stroke-linecap="round"/><text x="40.0" y="124.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.2">REACHING OVER A STRUCTURE</text><rect x="380.0" y="330.0" width="80.0" height="190.0" rx="6" fill="#FBE3E0" stroke="#D64535" stroke-width="2"/><text x="420.0" y="322.0" font-size="15" fill="#D64535" font-weight="700" text-anchor="middle">hazard</text><rect x="250.0" y="300.0" width="16.0" height="220.0" rx="3" fill="#1E4752"/><text x="274.0" y="500.0" font-size="15" fill="#1E4752" font-weight="700" text-anchor="start">structure</text><g><circle cx="140.0" cy="347.5" r="17.25" fill="#5F8F99"/><path d="M140.0,368.2 L140.0,439.5 M110.1,391.2 L169.9,391.2 M140.0,439.5 L119.3,520.0 M140.0,439.5 L160.7,520.0" stroke="#5F8F99" stroke-width="10.35" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="285.0" y1="520.0" x2="285.0" y2="520.0" stroke="#4E6A73" stroke-width="2.5" stroke-linecap="round"/></g><g class="a2"><line x1="258.0" y1="550.0" x2="380.0" y2="550.0" stroke="#122026" stroke-width="2" stroke-linecap="round"/><text x="319.0" y="572.0" font-size="19" fill="#122026" font-weight="700" text-anchor="middle">c</text><line x1="220.0" y1="520.0" x2="220.0" y2="300.0" stroke="#122026" stroke-width="2" stroke-linecap="round"/><text x="206.0" y="410.0" font-size="19" fill="#122026" font-weight="700" text-anchor="end">b</text><line x1="476.0" y1="520.0" x2="476.0" y2="330.0" stroke="#122026" stroke-width="2" stroke-linecap="round"/><text x="486.0" y="430.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">a</text></g><g class="a3"><path d="M156,366 C210,300 250,270 300,300 C330,318 345,345 352,370" stroke="#5F8F99" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a4"><circle cx="352.0" cy="372.0" r="9" fill="#2E8B57"/><text x="323.0" y="440.0" font-size="15" fill="#2E8B57" font-weight="700" text-anchor="middle">stops short</text></g><g class="a5"><text x="40.0" y="160.0" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">a: height of the hazard · b: height of the structure</text><text x="40.0" y="179.4" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">· c: horizontal distance to the hazard</text></g><g class="a6"><text x="520.0" y="124.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.2">REACHING THROUGH AN OPENING</text><rect x="660.0" y="210.0" width="18.0" height="300.0" rx="3" fill="#1E4752"/><rect x="656.0" y="336.0" width="26.0" height="44.0" rx="2" fill="#FFFFFF"/><rect x="840.0" y="300.0" width="80.0" height="116.0" rx="6" fill="#FBE3E0" stroke="#D64535" stroke-width="2"/><text x="880.0" y="292.0" font-size="15" fill="#D64535" font-weight="700" text-anchor="middle">hazard</text><text x="669.0" y="202.0" font-size="15" fill="#1E4752" font-weight="700" text-anchor="middle">guard with an opening e</text></g><g class="a8"><g class="
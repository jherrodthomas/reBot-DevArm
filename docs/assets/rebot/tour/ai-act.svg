<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t-ai-act d-ai-act" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-ai-act">When does an AI component make a product high-risk?</title><desc id="d-ai-act">A decision path. Q1: is there an AI system in the product? Q2: is it a safety component of the product? Q3: is the product under the Union law listed in Annex I, such as the Machinery Regulation, and does it need third-party conformity assessment? Yes to all three makes it a high-risk AI system under Article 6(1), with duties for risk management, data governance, logging, transparency, human oversight, accuracy, robustness, cybersecurity and conformity assessment. No at Q2, for example a learned component outside every safety function with its output clamped, means it is not high-risk by this route; other duties may still apply. The Act applies in stages.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.76%{opacity:0}3.82%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a1{animation:a1 17s linear infinite;}@keyframes a2{0%,4.71%{opacity:0}6.76%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a2{animation:a2 17s linear infinite;}@keyframes a3{0%,4.71%{opacity:0}6.76%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a3{animation:a3 17s linear infinite;}@keyframes a4{0%,7.65%{opacity:0}9.71%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a4{animation:a4 17s linear infinite;}@keyframes a5{0%,7.65%{opacity:0}9.71%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a5{animation:a5 17s linear infinite;}@keyframes a6{0%,10.59%{opacity:0}12.65%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a6{animation:a6 17s linear infinite;}@keyframes a7{0%,12.94%{opacity:0}15.00%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a7{animation:a7 17s linear infinite;}@keyframes a8{0%,12.94%{opacity:0}15.00%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a8{animation:a8 17s linear infinite;}@keyframes a9{0%{transform:translate(470.0px,136.0px)}18.82%{transform:translate(470.0px,136.0px)}23.53%{transform:translate(470.0px,256.0px)}28.24%{transform:translate(470.0px,386.0px)}32.94%{transform:translate(470.0px,540.0px)}100%{transform:translate(470.0px,540.0px)}}.a9{animation:a9 17s linear infinite;transform:translate(470.0px,540.0px);}@keyframes a10{0%,17.65%{opacity:0}19.71%,43.53%{opacity:1}45.59%,100%{opacity:0}}.a10{animation:a10 17s linear infinite;opacity:0;}@keyframes a11{0%{transform:translate(470.0px,136.0px)}50.59%{transform:translate(470.0px,136.0px)}55.29%{transform:translate(470.0px,256.0px)}61.18%{transform:translate(630.0px,256.0px)}64.71%{transform:translate(630.0px,300.0px)}100%{transform:translate(630.0px,300.0px)}}.a11{animation:a11 17s linear infinite;transform:translate(630.0px,300.0px);}@keyframes a12{0%,49.41%{opacity:0}51.47%,78.82%{opacity:1}80.88%,100%{opacity:0}}.a12{animation:a12 17s linear infinite;opacity:0;}@keyframes a13{0%,71.76%{opacity:0}73.82%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a13{animation:a13 17s linear infinite;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.0" y="0.0" width="960.0" height="660.0" rx="0" fill="#FFFFFF"/><text x="28.0" y="34.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.2">REGULATION (EU) 2024/1689 · THE AI ACT</text><text x="28.0" y="66.0" font-size="26" fill="#122026" font-weight="700" text-anchor="start">When does an AI component make a product high-risk?</text><g class="a1"><rect x="40.0" y="104.0" width="470.0" height="64.0" rx="12" fill="#E8F0F2"/><text x="56.0" y="130.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start">Q1</text><text x="96.0" y="131.0" font-size="17" fill="#122026" font-weight="700" text-anchor="start">Is there an AI system in the product?</text></g><g class="a2"><rect x="40.0" y="224.0" width="470.0" height="64.0" rx="12" fill="#E8F0F2"/><text x="56.0" y="250.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start">Q2</text><text x="96.0" y="251.0" font-size="17" fill="#122026" font-weight="700" text-anchor="start">Is it a safety component of the product?</text></g><g class="a3"><line x1="275.0" y1="168.0" x2="275.0" y2="220.0" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><text x="285.0" y="202.0" font-size="15" fill="#2E8B57" font-weight="700" text-anchor="start">yes</text></g><g class="a4"><rect x="40.0" y="344.0" width="470.0" height="84.0" rx="12" fill="#E8F0F2"/><text x="56.0" y="370.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start">Q3</text><text x="96.0" y="371.0" font-size="17" fill="#122026" font-weight="700" text-anchor="start">Is the product under Annex I law, such as the</text><text x="96.0" y="392.2" font-size="17" fill="#122026" font-weight="700" text-anchor="start">Machinery Regulation, and does it need</text><text x="96.0" y="413.5" font-size="17" fill="#122026" font-weight="700" text-anchor="start">third-party conformity assessment?</text></g><g class="a5"><line x1="275.0" y1="288.0" x2="275.0" y2="340.0" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><text x="285.0" y="322.0" font-size="15" fill="#2E8B57" font-weight="700" text-anchor="start">yes</text></g><g class="a6"><line x1="275.0" y1="428.0" x2="275.0" y2="476.0" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><text x="285.0" y="458.0" font-size="15" fill="#2E8B57" font-weight="700" text-anchor="start">yes</text><rect x="40.0" y="480.0" width="470.0" height="128.0" rx="12" fill="#FBE3E0" stroke="#D64535" stroke-width="2.5"/><text x="56.0" y="512.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">High-risk AI system, Article 6(1)</text><text x="56.0" y="540.0" font-size="15" fill="#122026" font-weight="400" text-anchor="start">risk management, data governance, logging, transparency,</text><text x="56.0" y="558.8" font-size="15" fill="#122026" font-weight="400" text-anchor="start">human oversight, accuracy, robustness, cybersecurity,</text><text x="56.0" y="577.5" font-size="15" fill="#122026" font-weight="400" text-anchor="start">conformity assessment</text></g><g class="a7"><rect x="590.0" y="224.0" width="340.0" height="168.0" rx="12" fill="#E3F3EA"/><text x="606.0" y="256.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">Not high-risk by this route</text><text x="606.0" y="284.0" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">e.g. a learned component outside every</text><text x="606.0" y="303.4" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">safety function, its output clamped.</text><text x="606.0" y="322.8" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">Other duties of the Act may still</text><text x="606.0" y="342.1" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">apply.</text></g><g class="a8"><path d="M510,256 L584,256" stroke="#D64535" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="524.0" y="246.0" font-size="15" fill="#D64535" font-weight="700" text-anchor="start">no</text></g><g class="a10"><g class="a9"><circle cx="0.0" cy="0.0" r="12" fill="#D64535" stroke="#FFFFFF" stroke-width="3"/></g></g><g class="a12"><g class="a11"><circle cx="0.0" cy="0.0" r="12" fill="#2E8B57" stroke="#FFFFFF" stroke-width="3"/></g></g><g class="a13"><rect x="590.0" y="430.0" width="340.0" height="104.0" rx="12" fill="#F4F3EF"/><text x="606.0" y="460.0" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">The Act applies in stages; which dates</text><text x="606.0" y="478.8" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">bind a high-risk system of this kind is</text><text x="606.0" y="497.5" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">to be checked against the current text.</text></g><text x="480.0" y="646.0" font-size="12.5" fill="#4E6A73" font-weight="400" text-anchor="middle">Explains the standard's idea, not a claim about the arm · clause references to be checked · tools/wiki/tour_figures.py</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t-iso-ts-15066 d-iso-ts-15066" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-ts-15066">Four ways a person and a robot can share space</title><desc id="d-iso-ts-15066">Four panels, one per collaborative operating mode. 1 Safety-rated monitored stop: the arm stops and stays stopped while a person is inside its zone, and resumes when they leave. 2 Hand guiding: the operator moves the arm by hand while holding an enabling device. 3 Speed and separation monitoring: the closer the person, the slower the arm, until it stops at the limit. 4 Power and force limiting: contact is allowed, with the force kept below the limit for that body region.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.25%{opacity:0}3.44%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a1{animation:a1 16s linear infinite;}@keyframes a2{0%,2.50%{opacity:0}4.69%,23.75%{opacity:1}25.94%,100%{opacity:0}}.a2{animation:a2 16s linear infinite;opacity:0;}@keyframes a3{0%{transform:rotate(0.0deg)}2.50%{transform:rotate(0.0deg)}5.62%{transform:rotate(-12.0deg)}8.75%{transform:rotate(0.0deg)}21.25%{transform:rotate(0.0deg)}23.75%{transform:rotate(-12.0deg)}100%{transform:rotate(-12.0deg)}}.a3{animation:a3 16s linear infinite;transform-origin:140.0px 285.0px;transform:rotate(0.0deg);}@keyframes a4{0%{transform:translate(0.0px,0.0px)}2.50%{transform:translate(0.0px,0.0px)}8.75%{transform:translate(-150.0px,0.0px)}18.75%{transform:translate(-150.0px,0.0px)}22.50%{transform:translate(0.0px,0.0px)}100%{transform:translate(0.0px,0.0px)}}.a4{animation:a4 16s linear infinite;transform:translate(0.0px,0.0px);}@keyframes a5{0%,8.75%{opacity:0}10.94%,19.38%{opacity:1}21.56%,100%{opacity:0}}.a5{animation:a5 16s linear infinite;opacity:0;}@keyframes a6{0%,1.25%{opacity:0}3.44%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a6{animation:a6 16s linear infinite;}@keyframes a7{0%,25.00%{opacity:0}27.19%,46.25%{opacity:1}48.44%,100%{opacity:0}}.a7{animation:a7 16s linear infinite;opacity:0;}@keyframes a8{0%{transform:rotate(0.0deg)}25.00%{transform:rotate(0.0deg)}32.50%{transform:rotate(18.0deg)}40.00%{transform:rotate(-10.0deg)}45.00%{transform:rotate(0.0deg)}100%{transform:rotate(0.0deg)}}.a8{animation:a8 16s linear infinite;transform-origin:600.0px 285.0px;transform:rotate(0.0deg);}@keyframes a9{0%,1.25%{opacity:0}3.44%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a9{animation:a9 16s linear infinite;}@keyframes a10{0%,47.50%{opacity:0}49.69%,68.75%{opacity:1}70.94%,100%{opacity:0}}.a10{animation:a10 16s linear infinite;opacity:0;}@keyframes a11{0%{transform:rotate(0.0deg)}47.50%{transform:rotate(0.0deg)}50.00%{transform:rotate(-14.0deg)}52.50%{transform:rotate(0.0deg)}57.50%{transform:rotate(-8.0deg)}62.50%{transform:rotate(0.0deg)}67.50%{transform:rotate(0.0deg)}100%{transform:rotate(0.0deg)}}.a11{animation:a11 16s linear infinite;transform-origin:140.0px 553.0px;transform:rotate(0.0deg);}@keyframes a12{0%{transform:translate(0.0px,0.0px)}47.50%{transform:translate(0.0px,0.0px)}62.50%{transform:translate(-120.0px,0.0px)}68.75%{transform:translate(-120.0px,0.0px)}100%{transform:translate(-120.0px,0.0px)}}.a12{animation:a12 16s linear infinite;transform:translate(-60.0px,0.0px);}@keyframes a13{0%,47.50%{transform:scaleX(1)}62.50%,95.00%{transform:scaleX(0.08)}96.88%,100%{transform:scaleX(1)}}.a13{animation:a13 16s linear infinite;transform-origin:360px 464px;transform:scaleX(0.5);}@keyframes a14{0%,47.50%{opacity:0}49.69%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a14{animation:a14 16s linear infinite;}@keyframes a15{0%,1.25%{opacity:0}3.44%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a15{animation:a15 16s linear infinite;}@keyframes a16{0%,70.00%{opacity:0}72.19%,91.25%{opacity:1}93.44%,100%{opacity:0}}.a16{animation:a16 16s linear infinite;opacity:0;}@keyframes a17{0%{transform:rotate(0.0deg)}70.00%{transform:rotate(0.0deg)}76.25%{transform:rotate(14.0deg)}86.25%{transform:rotate(14.0deg)}90.00%{transform:rotate(0.0deg)}100%{transform:rotate(0.0deg)}}.a17{animation:a17 16s linear infinite;transform-origin:600.0px 553.0px;transform:rotate(14.0deg);}@keyframes a18{0%,76.25%{transform:scaleY(0)}81.25%,95.00%{transform:scaleY(1)}96.88%,100%{transform:scaleY(0)}}.a18{animation:a18 16s linear infinite;transform-origin:833px 578px;transform:scaleY(1);}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.0" y="0.0" width="960.0" height="660.0" rx="0" fill="#FFFFFF"/><text x="28.0" y="34.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.2">ISO/TS 15066 · COLLABORATIVE ROBOTS</text><text x="28.0" y="66.0" font-size="26" fill="#122026" font-weight="700" text-anchor="start">Four ways a person and a robot can share space</text><g class="a1"><rect x="30.0" y="100.0" width="440.0" height="252.0" rx="14" fill="#F4F3EF"/><text x="48.0" y="132.0" font-size="19" fill="#122026" font-weight="700" text-anchor="start">1  Safety-rated monitored stop</text><text x="48.0" y="158.0" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">Nobody moves the arm while a person is inside; it</text><text x="48.0" y="176.8" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">resumes when they leave</text><rect x="60.0" y="314.0" width="200.0" height="10.0" rx="3" fill="#D9C7A6"/></g><rect x="27.0" y="97.0" width="446.0" height="258.0" rx="16" fill="none" stroke="#F2A33A" stroke-width="4" class="a2"/><g><rect x="70.0" y="196.0" width="250.0" height="118.0" rx="8" fill="none" stroke="#D64535" stroke-width="2" stroke-dasharray="7 6"/><rect x="114.5" y="305.5" width="51.0" height="8.5" rx="3" fill="#1E4752"/><rect x="126.4" y="285.1" width="27.2" height="22.1" rx="5" fill="#
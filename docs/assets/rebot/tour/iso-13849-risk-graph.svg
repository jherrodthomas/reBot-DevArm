<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t-iso-13849-risk-graph d-iso-13849-risk-graph" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-13849-risk-graph">The risk graph: three questions give the required PL</title><desc id="d-iso-13849-risk-graph">The risk graph of ISO 13849-1 as a tree from a start point: severity S1 slight or S2 serious, then frequency or duration of exposure F1 or F2, then possibility of avoiding the hazard P1 or P2, ending in a required Performance Level from a (lowest) to e (highest). Two paths are traced with ratings read from the record's risk assessment: HZ-M01 Joint pinch / crushing finger or hand during RUN, S2 F2 P2 gives PLr e; HZ-M02 Gripper-jaw shearing, S2 F1 P2 gives PLr d. The ratings are the package's, not yet re-rated.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.25%{opacity:0}3.44%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a1{animation:a1 16s linear infinite;}@keyframes a2{0%,7.50%{stroke-dashoffset:578}22.50%,95.00%{stroke-dashoffset:0}96.88%,100%{stroke-dashoffset:578}}.a2{animation:a2 16s linear infinite;stroke-dasharray:578;stroke-dashoffset:0;}@keyframes a3{0%,23.75%{opacity:0}25.94%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a3{animation:a3 16s linear infinite;}@keyframes a4{0%,22.50%{opacity:0}24.69%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a4{animation:a4 16s linear infinite;}@keyframes a5{0%,41.25%{stroke-dashoffset:578}56.25%,95.00%{stroke-dashoffset:0}96.88%,100%{stroke-dashoffset:578}}.a5{animation:a5 16s linear infinite;stroke-dasharray:578;stroke-dashoffset:0;}@keyframes a6{0%,57.50%{opacity:0}59.69%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a6{animation:a6 16s linear infinite;}@keyframes a7{0%,56.25%{opacity:0}58.44%,95.00
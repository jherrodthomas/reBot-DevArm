rcle cx="760.0" cy="275.0" r="16" fill="#1E4752"/><line x1="760.0" y1="275.0" x2="690.0" y2="235.0" stroke="#5F8F99" stroke-width="12" stroke-linecap="round"/><circle cx="690.0" cy="235.0" r="8" fill="#1E4752"/></g></g><g class="a4"><circle cx="110.0" cy="275.0" r="26" fill="#5F8F99"/><circle cx="110.0" cy="275.0" r="10" fill="#FFFFFF"/></g><g class="a5"><path d="M140,229 L230,229" stroke="#5F8F99" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="140.0" y="219.0" font-size="16" fill="#5F8F99" font-weight="700" text-anchor="start">K: approach speed</text></g><g class="a6"><rect x="464.0" y="128.0" width="12.0" height="296.0" rx="4" fill="#F2A33A"/></g><g class="a7"><line x1="470.0" y1="470.0" x2="650.0" y2="470.0" stroke="#122026" stroke-width="2.5" stroke-linecap="round"/><line x1="470.0" y1="460.0" x2="470.0" y2="480.0" stroke="#122026" stroke-width="2.5" stroke-linecap="round"/><line x1="650.0" y1="460.0" x2="650.0" y2="480.0" stroke="#122026" stroke-width="2.5" stroke-linecap="round"/><text x="560.0" y="498.0" font-size="17" fill="#122026" font-weight="700" text-anchor="middle">S: minimum distance</text></g><g class="a8"><rect x="470" y="132" width="90" height="288" fill="#F2A33A" fill-opacity="0.25"/></g><g class="a9"><text x="515.0" y="440.0" font-size="18" fill="#8A5A0B" font-weight="700" text-anchor="middle">C</text></g><g class="a10"><text x="120.0" y="508.0" font-size="16" fill="#122026" font-weight="700" text-anchor="start">T: time from detection to standstill</text><rect x="120.0" y="520.0" width="300.0" height="18.0" rx="4" fill="#E8F0F2"/></g><rect x="120.0" y="520.0" width="300.0" height="18.0" rx="4" fill="#1E4752" class="a11"/><g class="a12"><rect x="480.0" y="500.0" width="450.0" height="84.0" rx="12" fill="#FBF3E3"/><text x="705.0" y="536.0" font-size="30" fill="#122026" font-weight="700" text-anchor="middle">S = K × T + C</text><text x="705.0" y="568.0" font-size="15.5" fill="#122026" font
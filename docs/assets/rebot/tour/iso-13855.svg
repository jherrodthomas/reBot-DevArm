<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t-iso-13855 d-iso-13855" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-13855">How far away must the detection be? S = K × T + C</title><desc id="d-iso-13855">Top view: a person approaches at speed K towards a detection line in front of the arm's hazard zone. When the person crosses the line, a timer T runs from detection to standstill while the person keeps moving; the arm stops before the person arrives. The minimum distance S from the detection line to the hazard zone is K times T plus C, an intrusion allowance for how far a hand reaches past the detection before it is detected.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.33%{opacity:0}3.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a1{animation:a1 15s linear infinite;}@keyframes a2{0%{transform:rotate(0.0deg)}0.00%{transform:rotate(0.0deg)}5.33%{transform:rotate(40.0deg)}10.67%{transform:rotate(0.0deg)}16.00%{transform:rotate(40.0deg)}21.33%{transform:rotate(0.0deg)}26.67%{transform:rotate(40.0deg)}30.67%{transform:rotate(20.0deg)}34.67%{transform:rotate(0.0deg)}100%{transform:rotate(0.0deg)}}.a2{animation:a2 15s linear infinite;transform-origin:760.0px 275.0px;transform:rotate(0.0deg);}@keyframes a3{0%,1.33%{opacity:0}3.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a3{animation:a3 15s linear infinite;}@keyframes a4{0%{transform:translate(0.0px,0.0px)}4.00%{transform:translate(0.0px,0.0px)}20.00%{transform:translate(260.0px,0.0px)}34.67%{transform:translate(400.0px,0.0px)}100%{transform:translate(400.0px,0.0px)}}.a4{animation:a4 15s linear infinite;transform:translate(400.0px,0.0px);}@keyframes a5{0%,5.33%{opacity:0}7.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a5{animation:
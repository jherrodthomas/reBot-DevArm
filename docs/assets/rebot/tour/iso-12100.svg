<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t-iso-12100 d-iso-12100" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-12100">The loop: assess, reduce in three steps, assess again</title><desc id="d-iso-12100">Left, the four steps of risk assessment: determine the limits of the machine, identify hazards, estimate the risk, evaluate it, then ask whether the risk is reduced enough. If not, right, the three-step method in its fixed order: inherently safe design, then safeguarding and complementary protective measures, then information for use. A measure can bring new hazards, so the loop goes back to hazard identification; when the risk is reduced enough, the result is documented. Chips name the record's work product for each step.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.18%{opacity:0}3.24%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a1{animation:a1 17s linear infinite;}@keyframes a2{0%,1.76%{opacity:0}3.82%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a2{animation:a2 17s linear infinite;}@keyframes a3{0%,4.71%{opacity:0}6.76%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a3{animation:a3 17s linear infinite;}@keyframes a4{0%,4.71%{opacity:0}6.76%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a4{animation:a4 17s linear infinite;}@keyframes a5{0%,7.65%{opacity:0}9.71%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a5{animation:a5 17s linear infinite;}@keyframes a6{0%,7.65%{opacity:0}9.71%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a6{animation:a6 17s linear infinite;}@keyframes a7{0%,10.59%{opacity:0}12.65%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a7{animation:a7 17s linear infinite;}@keyframes a8{0%,10.59%{opacity:0}12.65%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a8{animation:a8 17s linear infinite
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t-iso-iec-tr-5469 d-iso-iec-tr-5469" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-iec-tr-5469">Keep the learned part outside the safety function</title><desc id="d-iso-iec-tr-5469">A pipeline from a learned component that proposes a motion, through a clamp of joint, speed and torque limits and a safety layer with watchdog, modes and plausibility checks, to the motors; below, a hardwired safety chain that cuts motor power whatever the software does. An ordinary command passes; a too-fast command leaves the clamp inside the limits; a command that breaks a rule is stopped by the safety layer. Below, the two questions the report uses to classify an AI component: its technology class and its usage level.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.88%{opacity:0}4.06%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a1{animation:a1 16s linear infinite;}@keyframes a2{0%,4.38%{opacity:0}6.56%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a2{animation:a2 16s linear infinite;}@keyframes a3{0%,4.38%{opacity:0}6.56%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a3{animation:a3 16s linear infinite;}@keyframes a4{0%,6.88%{opacity:0}9.06%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a4{animation:a4 16s linear infinite;}@keyframes a5{0%,6.88%{opacity:0}9.06%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a5{animation:a5 16s linear infinite;}@keyframes a6{0%,9.38%{opacity:0}11.56%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a6{animation:a6 16s linear infinite;}@keyframes a7{0%,9.38%{opacity:0}11.56%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a7{animation:a7 16s linear infinite;}@keyframes a8{0%,11.88%{opacity:0}14.06%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a8{animation:a8 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t-en-60204 d-en-60204" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-en-60204">Three ways to stop: the stop categories</title><desc id="d-en-60204">Three speed-against-time graphs share one stop demand. Category 0: power is removed at once and the motors coast to a stop, uncontrolled. Category 1: a controlled stop with power available, then power removed at standstill. Category 2: a controlled stop with power left on and standstill monitored. Beside them, other topics of EN 60204-1: the supply disconnecting device, overcurrent protection, protection against electric shock, protective bonding, control circuits and functions, and verification tests; an emergency stop is category 0 or 1.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,2.00%{opacity:0}4.33%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a1{animation:a1 15s linear infinite;}@keyframes a2{0%,4.00%{opacity:0}6.33%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a2{animation:a2 15s linear infinite;}@keyframes a3{0%,6.00%{stroke-dashoffset:520}16.67%,94.67%{stroke-dashoffset:0}96.67%,100%{stroke-dashoffset:520}}.a3{animation:a3 15s linear infinite;stroke-dasharray:520;stroke-dashoffset:0;}@keyframes a4{0%,12.00%{opacity:0}14.33%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a4{animation:a4 15s linear infinite;}@keyframes a5{0%,22.67%{opacity:0}25.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a5{animation:a5 15s linear infinite;}@keyframes a6{0%,24.67%{stroke-dashoffset:520}35.33%,94.67%{stroke-dashoffset:0}96.67%,100%{stroke-dashoffset:520}}.a6{animation:a6 15s linear infinite;stroke-dasharray:520;stroke-dashoffset:0;}@keyframes a7{0%,30.67%{opacity:0}33.00%,94.67%{opacity:1}97.00%,100%{opacity:0}
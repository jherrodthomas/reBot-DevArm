<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t-iso-21448 d-iso-21448" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-21448">Shrink the unknown and the unsafe</title><desc id="d-iso-21448">A two-by-two grid: known or unknown, safe or unsafe. Area 1 known and safe, handled by a measure or a limit; area 2 known and unsafe, for example a contact too light for a torque estimate to sense; area 3 unknown and unsafe, the scenes nobody has thought of yet; area 4 unknown and safe. The animation shrinks area 3 as triggering conditions are found through analysis, tests and field data, moving them into area 2, then shrinks area 2 as measures or envelope limits move it into area 1; what is left is argued as acceptable residual risk.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.33%{opacity:0}3.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a1{animation:a1 15s linear infinite;}@keyframes a2{0%,13.33%{transform:scale(1)}29.33%,94.67%{transform:scale(0.45)}96.67%,100%{transform:scale(1)}}.a2{animation:a2 15s linear infinite;transform-origin:600px 310px;transform:scale(0.45);}@keyframes a3{0%,40.00%{transform:scale(1)}56.00%,94.67%{transform:scale(0.5)}96.67%,100%{transform:scale(1)}}.a3{animation:a3 15s linear infinite;transform-origin:80px 310px;transform:scale(0.5);}@keyframes a4{0%,16.00%{stroke-dashoffset:120}25.33%,94.67%{stroke-dashoffset:0}96.67%,100%{stroke-dashoffset:120}}.a4{animation:a4 15s linear infinite;stroke-dasharray:120;stroke-dashoffset:0;}@keyframes a5{0%,42.67%{stroke-dashoffset:60}50.67%,94.67%{stroke-dashoffset:0}96.67%,100%{stroke-dashoffset:60}}.a5{animation:a5 15s linear infinite;stroke-dasharray:60;stroke-dashoffset:0;}@keyframes a6{0%,14.67%{opacity:0}17.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a6{animation:a6 15s linear infinite;}@keyframes a7{0%,41.33%{opacity:0}43.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a7{animation:a7 15s linear infinite;}@keyframes a8{0%,68.00%{opacity:0}70.33%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a8{animation:a8 15s linear infinite;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.0" y="0.0" width="960.0" height="620.0" rx="0" fill="#FFFFFF"/><text x="28.0" y="34.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.2">ISO 21448 · HAZARDS WITHOUT A FAILURE (USED AS A METHOD)</text><text x="28.0" y="66.0" font-size="26" fill="#122026" font-weight="700" text-anchor="start">Shrink the unknown and the unsafe</text><g class="a1"><text x="205.0" y="118.0" font-size="18" fill="#1E4752" font-weight="700" text-anchor="middle">Known</text><text x="475.0" y="118.0" font-size="18" fill="#1E4752" font-weight="700" text-anchor="middle">Unknown</text><text x="52" y="225" font-size="18" fill="#1E4752" font-weight="700" text-anchor="middle" transform="rotate(-90 52 225)">Unsafe</text><text x="52" y="415" font-size="18" fill="#1E4752" font-weight="700" text-anchor="middle" transform="rotate(-90 52 415)">Safe</text><rect x="74.0" y="134.0" width="262.0" height="182.0" rx="12" fill="#FBF3E3"/><text x="90.0" y="164.0" font-size="18" fill="#122026" font-weight="700" text-anchor="start">2  Known and unsafe</text><text x="90.0" y="192.0" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">e.g. a contact too light for</text><text x="90.0" y="210.8" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">the torque estimate to sense</text><rect x="344.0" y="134.0" width="262.0" height="182.0" rx="12" fill="#FBE3E0"/><text x="360.0" y="164.0" font-size="18" fill="#122026" font-weight="700" text-anchor="start">3  Unknown and unsafe</text><text x="360.0" y="192.0" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">the scenes nobody has thought</text><text x="360.0" y="210.8" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">of yet</text><rect x="74.0" y="324.0" width="262.0" height="182.0" rx="12" fill="#E3F3EA"/><text x="90.0" y="354.0" font-size="18" fill="#122026" font-weight="700" text-anchor="start">1  Known and safe</text><text x="90.0" y="382.0" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">handled by a measure or a</text><text x="90.0" y="400.8" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">limit</text><rect x="344.0" y="324.0" width="262.0" height="182.0" rx="12" fill="#F4F3EF"/><text x="360.0" y="354.0" font-size="18" fill="#122026" font-weight="700" text-anchor="start">4  Unknown and safe</text><text x="360.0" y="382.0" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">harmless whether found or not</text></g><rect fill-opacity="0.35" x="370.0" y="226.0" width="210.0" height="80.0" rx="10" fill="#D64535" class="a2"/><rect fill-opacity="0.45" x="100.0" y="240.0" width="210.0" height="66.0" rx="10" fill="#F2A33A" class="a3"/><path d="M380,280 C340,300 320,300 290,280" stroke="#1E4752" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="a4"/><path d="M296,306 L296,360" stroke="#1E4752" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="a5"/><g class="a6"><rect x="650.0" y="130.0" width="280.0" height="112.0" rx="12" fill="#F4F3EF"/><circle cx="676.0" cy="160.0" r="15" fill="#1E4752"/><text x="676.0" y="166.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="700.0" y="164.0" font-size="17" fill="#122026" font-weight="700" text-anchor="start">Find the triggering</text><text x="700.0" y="185.2" font-size="17" fill="#122026" font-weight="700" text-anchor="start">conditions</text><text x="668.0" y="212.0" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">analysis, tests, field data:</text><text x="668.0" y="230.8" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">move area 3 into area 2</text></g><g class="a7"><rect x="650.0" y="260.0" width="280.0" height="112.0" rx="12" fill="#F4F3EF"/><circle cx="676.0" cy="290.0" r="15" fill="#1E4752"/><text x="676.0" y="296.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="700.0" y="294.0" font-size="17" fill="#122026" font-weight="700" text-anchor="start">Add measures or limit</text><text x="700.0" y="315.2" font-size="17" fill="#122026" font-weight="700" text-anchor="start">the envelope</text><text x="668.0" y="342.0" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">move area 2 into area 1</text></g><g class="a8"><rect x="650.0" y="390.0" width="280.0" height="112.0" rx="12" fill="#F4F3EF"/><circle cx="676.0" cy="420.0" r="15" fill="#1E4752"/><text x="676.0" y="426.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="700.0" y="424.0" font-size="17" fill="#122026" font-weight="700" text-anchor="start">Argue what is left</text><text x="668.0" y="472.0" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">the residual risk of areas 2 and</text><text x="668.0" y="490.8" font-size="15" fill="#4E6A73" font-weight="400" text-anchor="start">3 is acceptable</text></g><text x="480.0" y="606.0" font-size="12.5" fill="#4E6A73" font-weight="400" text-anchor="middle">Explains the standard's idea, not a claim about the arm · clause references to be checked · tools/wiki/tour_figures.py</text></svg>

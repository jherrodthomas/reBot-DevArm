<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t-iec-62443 d-iec-62443" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iec-62443">Zones, conduits, and a safety chain no network can reach</title><desc id="d-iec-62443">Four zones from left to right: the network and laptops, the host PC with ROS 2, the SDK and the policy, the CAN motor bus, and the hardwired safety chain. Conduits join the first three; there is no conduit to the safety chain. A first attack is refused at the first conduit because it is not authenticated; a second gets through to the motor bus and still cannot reach the chain, which has no network path. Below, the eight practices of IEC 62443-4-1: security management, requirements, secure by design, secure implementation, verification and validation, security issue management, update management and guidelines; and IEC 62443-4-2's component requirements under seven foundational requirements, each at a security level 1 to 4.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.76%{opacity:0}3.82%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a1{animation:a1 17s linear infinite;}@keyframes a2{0%,4.12%{opacity:0}6.18%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a2{animation:a2 17s linear infinite;}@keyframes a3{0%,6.47%{opacity:0}8.53%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a3{animation:a3 17s linear infinite;}@keyframes a4{0%,8.82%{opacity:0}10.88%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a4{animation:a4 17s linear infinite;}@keyframes a5{0%,11.18%{opacity:0}13.24%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a5{animation:a5 17s linear infinite;}@keyframes a6{0%,12.94%{opacity:0}15.00%,95.29%{opacity:1}97.35%,100%{opacity:0}}.a6{animation:a6 17s linear infinite;}@keyframes a7{0%,15.29%{
" fill="#E8F0F2" stroke-linecap="round" stroke-linejoin="round"/><text x="470.0" y="220.0" font-size="15" fill="#1E4752" font-weight="700" text-anchor="middle">ARGUMENT: over each hazard and safety function</text></g><g class="a3"><line x1="470.0" y1="236.0" x2="160.0" y2="270.0" stroke="#1E4752" stroke-width="2" stroke-linecap="round"/><rect x="35.0" y="270.0" width="250.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#1E4752" stroke-width="2.5"/><text x="160.0" y="296.0" font-size="16" fill="#122026" font-weight="700" text-anchor="middle">Every hazard is identified</text><text x="160.0" y="314.4" font-size="16" fill="#122026" font-weight="700" text-anchor="middle">and rated</text></g><g class="a4"><line x1="470.0" y1="236.0" x2="480.0" y2="270.0" stroke="#1E4752" stroke-width="2" stroke-linecap="round"/><rect x="355.0" y="270.0" width="250.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#1E4752" stroke-width="2.5"/><text x="480.0" y="296.0" font-size="16" fill="#122026" font-weight="700" text-anchor="middle">Each safety function</text><text x="480.0" y="314.4" font-size="16" fill="#122026" font-weight="700" text-anchor="middle">reaches its PL</text></g><g class="a5"><line x1="470.0" y1="236.0" x2="790.0" y2="270.0" stroke="#1E4752" stroke-width="2" stroke-linecap="round"/><rect x="665.0" y="270.0" width="250.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#1E4752" stroke-width="2.5"/><text x="790.0" y="296.0" font-size="16" fill="#122026" font-weight="700" text-anchor="middle">The assumptions hold in</text><text x="790.0" y="314.4" font-size="16" fill="#122026" font-weight="700" text-anchor="middle">use</text></g><g class="a6"><line x1="110.0" y1="380.0" x2="160.0" y2="334.0" stroke="#2E8B57" stroke-width="2" stroke-linecap="round"/><circle cx="110.0" cy="404.0" r="24" fill="#E3F3EA" stroke="#2E8B57" stroke-width="2.5"/><text x="110.0" y="411.0" font-size="18" fill="#2E8B57" font-weight="700" text-anchor="middle">E</text></g><g class="a7"><line x1="210.0" y1="380.
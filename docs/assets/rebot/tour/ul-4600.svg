="middle">the claim stays open until the defeater is closed</text></g><g class="a14"><text x="580.0" y="482.0" font-size="14.5" fill="#D64535" font-weight="400" text-anchor="start">a reason to doubt the</text><text x="580.0" y="500.1" font-size="14.5" fill="#D64535" font-weight="400" text-anchor="start">claim, published,</text><text x="580.0" y="518.2" font-size="14.5" fill="#D64535" font-weight="400" text-anchor="start">never hidden</text></g><g class="a15"><path d="M930,420 C960,300 960,180 704,131" stroke="#5F8F99" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="948.0" y="470.0" font-size="14.5" fill="#5F8F99" font-weight="700" text-anchor="end">field data:</text><text x="948.0" y="488.0" font-size="14.5" fill="#5F8F99" font-weight="700" text-anchor="end">safety performance</text><text x="948.0" y="506.0" font-size="14.5" fill="#5F8F99" font-weight="700" text-anchor="end">indicators</text></g><g class="a16"><rect x="30.0" y="540.0" width="900.0" height="66.0" rx="12" fill="#F4F3EF"/><text x="48.0" y="568.0" font-size="16" fill="#122026" font-weight="400" text-anchor="start">UL 4600 asks for the argument itself: claims, arguments, evidence, the defeaters you found, and the</text><text x="48.0" y="588.0" font-size="16" fill="#122026" font-weight="400" text-anchor="start">indicators that would tell you the claim has stopped being true.</text></g><text x="480.0" y="646.0" font-size="12.5" fill="#4E6A73" font-weight="400" text-anchor="middle">Explains the standard's idea, not a claim about the arm · clause references to be checked · tools/wiki/tour_figures.py</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t-ul-4600 d-ul-4600" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-ul-4600">Claims, arguments, evidence, and the reasons to doubt them</title><desc id="d-ul-4600">A safety case as a tree: the top claim that the arm is acceptably safe in its envelope, an argument over each hazard and safety function, and three sub-claims: every hazard is identified and rated, each safety function reaches its PL, the assumptions hold in use. Evidence items, each with its review state, attach under the sub-claims. A defeater, a reason to doubt a claim, attaches to the second sub-claim, which stays open until the defeater is closed. Field data return as safety performance indicators to the top claim.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.88%{opacity:0}4.06%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a1{animation:a1 16s linear infinite;}@keyframes a2{0%,6.88%{opacity:0}9.06%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a2{animation:a2 16s linear infinite;}@keyframes a3{0%,11.88%{opacity:0}14.06%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a3{animation:a3 16s linear infinite;}@keyframes a4{0%,15.00%{opacity:0}17.19%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a4{animation:a4 16s linear infinite;}@keyframes a5{0%,18.12%{opacity:0}20.31%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a5{animation:a5 16s linear infinite;}@keyframes a6{0%,23.75%{opacity:0}25.94%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a6{animation:a6 16s linear infinite;}@keyframes a7{0%,26.25%{opacity:0}28.44%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a7{animation:a7 16s linear infinite;}@keyframes a8{0%,28.75%{opacity:0}30.94%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a8{animation:a8 16s linear infini
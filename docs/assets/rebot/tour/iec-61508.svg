<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="t-iec-61508 d-iec-61508" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iec-61508">One lifecycle, managed, verified and assessed throughout</title><desc id="d-iec-61508">The overall safety lifecycle of IEC 61508 as eight phases from concept and scope, hazard and risk analysis and safety requirements, through realisation in hardware and software, installation, validation and operation, to decommissioning. Beside every phase run management of functional safety and verification; a functional safety assessment checks the requirements, the validation and changes in operation. Cards explain the safety integrity levels SIL 1 to 4, that the assessor's independence grows with SIL, and the tool classes T1 to T3.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,2.50%{opacity:0}4.69%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a1{animation:a1 16s linear infinite;}@keyframes a2{0%,5.31%{opacity:0}7.50%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a2{animation:a2 16s linear infinite;}@keyframes a3{0%,8.12%{opacity:0}10.31%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a3{animation:a3 16s linear infinite;}@keyframes a4{0%,10.94%{opacity:0}13.12%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a4{animation:a4 16s linear infinite;}@keyframes a5{0%,13.75%{opacity:0}15.94%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a5{animation:a5 16s linear infinite;}@keyframes a6{0%,16.56%{opacity:0}18.75%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a6{animation:a6 16s linear infinite;}@keyframes a7{0%,19.38%{opacity:0}21.56%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a7{animation:a7 16s linear infinite;}@keyframes a8{0%,22.19%{opacity:0}24.38%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a8{animation
ll="#E8F0F2"/><text x="166.0" y="457.0" font-size="18.5" fill="#122026" font-weight="700" text-anchor="start">6  Overall safety validation</text><line x1="340.0" y1="412.0" x2="340.0" y2="421.0" stroke="#4E6A73" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/></g><g class="a7"><rect x="150.0" y="488.0" width="380.0" height="52.0" rx="10" fill="#E8F0F2"/><text x="166.0" y="521.0" font-size="18.5" fill="#122026" font-weight="700" text-anchor="start">7  Operation, maintenance, modification</text><line x1="340.0" y1="476.0" x2="340.0" y2="485.0" stroke="#4E6A73" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/></g><g class="a8"><rect x="150.0" y="552.0" width="380.0" height="52.0" rx="10" fill="#E8F0F2"/><text x="166.0" y="585.0" font-size="18.5" fill="#122026" font-weight="700" text-anchor="start">8  Decommissioning</text><line x1="340.0" y1="540.0" x2="340.0" y2="549.0" stroke="#4E6A73" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/></g><g class="a9"><rect x="40.0" y="104.0" width="40.0" height="500.0" rx="10" fill="#1E4752"/><text x="66" y="354" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" transform="rotate(-90 66 354)">Management of functional safety</text></g><g class="a10"><rect x="92.0" y="104.0" width="40.0" height="500.0" rx="10" fill="#5F8F99"/><text x="118" y="354" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" transform="rotate(-90 118 354)">Verification of each phase</text></g><g class="a11"><line x1="560.0" y1="104.0" x2="560.0" y2="604.0" stroke="#F2A33A" stroke-width="4" stroke-linecap="round"/><text x="574.0" y="98.0" font-size="16" fill="#8A5A0B" font-weight="700" text-anchor="start">Functional safety assessment</text></g><g class="a12"><circle cx="560.0" cy="258.0" r="11" fill="#F2A33A" stroke="#FFFFFF" stroke-width="3"/><line x1="534.0" y1="258.0" x2="548.0" y2="258.0" stroke="#F2A33A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/></g><g class="a13"><circle cx="560.0" cy="450.0" r="11" fill="#F2A33A" stroke="#FFFFFF" stroke-width="3"/><line x1="534.0" y1="450.0" x2="548.0" y2="450.0" stroke="#F2A33A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/></g><g class="a14"><circle cx="560.0" cy="514.0" r="11" fill="#F2A33A" stroke="#FFFFFF" stroke-width="3"/><line x1="534.0" y1="514.0" x2="548.0" y2="514.0" stroke="#F2A33A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/></g><g class="a16"><g class="a15"><circle cx="0.0" cy="0.0" r="11" fill="#F2A33A" stroke="#FFFFFF" stroke-width="3"/></g></g><g class="a17"><rect x="730.0" y="150.0" width="210.0" height="144.0" rx="12" fill="#F4F3EF"/><text x="744.0" y="178.0" font-size="18" fill="#122026" font-weight="700" text-anchor="start">SIL 1 to SIL 4</text><text x="744.0" y="206.0" font-size="15" fill="#122026" font-weight="400" text-anchor="start">the integrity a safety</text><text x="744.0" y="224.8" font-size="15" fill="#122026" font-weight="400" text-anchor="start">function must reach;</text><text x="744.0" y="243.5" font-size="15" fill="#122026" font-weight="400" text-anchor="start">machinery uses up to</text><text x="744.0" y="262.2" font-size="15" fill="#122026" font-weight="400" text-anchor="start">SIL 3 (IEC 62061)</text></g><g class="a18"><rect x="730.0" y="310.0" width="210.0" height="144.0" rx="12" fill="#F4F3EF"/><text x="744.0" y="338.0" font-size="18" fill="#122026" font-weight="700" text-anchor="start">Independence grows</text><text x="744.0" y="360.5" font-size="18" fill="#122026" font-weight="700" text-anchor="start">with SIL</text><text x="744.0" y="388.0" font-size="15" fill="#122026" font-weight="400" text-anchor="start">the higher the</text><text x="744.0" y="406.8" font-size="15" fill="#122026" font-weight="400" text-anchor="start">integrity, the more</text><text x="744.0" y="425.5" font-size="15" fill="#122026" font-weight="400" text-anchor="start">independent the</text><text x="744.0" y="444.2" font-size="15" fill="#122026" font-weight="400" text-anchor="start">assessor must be</text></g><g class="a19"><rect x="730.0" y="470.0" width="210.0" height="144.0" rx="12" fill="#F4F3EF"/><text x="744.0" y="498.0" font-size="18" fill="#122026" font-weight="700" text-anchor="start">Tool classes T1,</text><text x="744.0" y="520.5" font-size="18" fill="#122026" font-weight="700" text-anchor="start">T2, T3</text><text x="744.0" y="548.0" font-size="15" fill="#122026" font-weight="400" text-anchor="start">how far a software tool</text><text x="744.0" y="566.8" font-size="15" fill="#122026" font-weight="400" text-anchor="start">can put an error into</text><text x="744.0" y="585.5" font-size="15" fill="#122026" font-weight="400" text-anchor="start">the result, and what</text><text x="744.0" y="604.2" font-size="15" fill="#122026" font-weight="400" text-anchor="start">that requires</text></g><text x="480.0" y="666.0" font-size="12.5" fill="#4E6A73" font-weight="400" text-anchor="middle">Explains the standard's idea, not a claim about the arm · clause references to be checked · tools/wiki/tour_figures.py</text></svg>

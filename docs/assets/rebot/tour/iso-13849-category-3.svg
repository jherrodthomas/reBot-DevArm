<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t-iso-13849-category-3 d-iso-13849-category-3" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-13849-category-3">Two channels: one fault does not lose the stop</title><desc id="d-iso-13849-category-3">An emergency-stop device with two contacts feeds two channels, each an input, a logic and an output, with cross-monitoring between the logic blocks. Each channel drives a contactor, K1 and K2, whose contacts sit in series on the 24 V motor supply. A stop demand travels down both channels and both contacts open. Then a fault sticks the output of channel 1 on, so K1 stays closed; at the next demand K2 still opens and removes power, and the monitoring detects the fault so the machine cannot restart until it is repaired. This is the shape of category 3, the architecture most often used to reach PL d.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.11%{opacity:0}3.06%,95.56%{opacity:1}97.50%,100%{opacity:0}}.a1{animation:a1 18s linear infinite;}@keyframes a2{0%,5.00%{opacity:0}6.94%,95.56%{opacity:1}97.50%,100%{opacity:0}}.a2{animation:a2 18s linear infinite;}@keyframes a3{0%,7.22%{opacity:0}9.17%,95.56%{opacity:1}97.50%,100%{opacity:0}}.a3{animation:a3 18s linear infinite;}@keyframes a4{0%,8.89%{opacity:0}10.83%,95.56%{opacity:1}97.50%,100%{opacity:0}}.a4{animation:a4 18s linear infinite;}@keyframes a5{0%,6.67%{opacity:0}8.61%,95.56%{opacity:1}97.50%,100%{opacity:0}}.a5{animation:a5 18s linear infinite;}@keyframes a6{0.00%{opacity:1}30.00%{opacity:1}31.39%{opacity:0}45.56%{opacity:0}46.94%{opacity:1}100.00%{opacity:1}}.a6{animation:a6 18s linear infinite;}@keyframes a7{0.00%{opacity:0}30.00%{opacity:0}31.39%{opacity:1}45.56%{opacity:1}46.9
</text><text x="744.0" y="461.5" font-size="15.5" fill="#122026" font-weight="400" text-anchor="start">to SIL 4.</text></g><text x="480.0" y="606.0" font-size="12.5" fill="#4E6A73" font-weight="400" text-anchor="middle">Explains the standard's idea, not a claim about the arm · clause references to be checked · tools/wiki/tour_figures.py</text></svg>

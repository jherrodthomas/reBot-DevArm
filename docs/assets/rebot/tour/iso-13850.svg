nt-size="14" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.2">ISO 13850 · THE EMERGENCY STOP FUNCTION</text><text x="28.0" y="66.0" font-size="26" fill="#122026" font-weight="700" text-anchor="start">Press, stop, stay stopped, reset, then restart on purpose</text><g class="a1"><circle cx="170.0" cy="240.0" r="92" fill="#F7D046"/><circle cx="170.0" cy="240.0" r="70" fill="#FFFFFF" stroke="#C9D6DB" stroke-width="2"/></g><g class="a2"><circle cx="170.0" cy="240.0" r="56" fill="#D64535" stroke="#A3281C" stroke-width="4"/><circle cx="158.0" cy="226.0" r="18" fill="#E8776B"/></g><g class="a3"><circle cx="170.0" cy="244.0" r="50" fill="#B8362A" stroke="#7E1F16" stroke-width="4"/></g><g class="a4"><rect x="118.0" y="344.0" width="104.0" height="34.0" rx="8" fill="#FBE3E0"/><text x="170.0" y="367.0" font-size="17" fill="#D64535" font-weight="700" text-anchor="middle">latched</text></g><g class="a6"><rect x="60.0" y="560.0" width="220.0" height="12.0" rx="3" fill="#D9C7A6"/><rect x="140.0" y="550.0" width="60.0" height="10.0" rx="3" fill="#1E4752"/><rect x="154.0" y="526.0" width="32.0" height="26.0" rx="5" fill="#1E4752"/><g class="a5"><line x1="170.0" y1="526.0" x2="205.0" y2="465.4" stroke="#B9CFD4" stroke-width="13.0" stroke-linecap="round"/><line x1="205.0" y1="465.4" x2="263.3" y2="486.6" stroke="#B9CFD4" stroke-width="11.0" stroke-linecap="round"/><circle cx="205.0" cy="465.4" r="8.0" fill="#1E4752"/><line x1="263.3" y1="486.6" x2="273.3" y2="498.6" stroke="#F2A33A" stroke-width="5.0" stroke-linecap="round"/><line x1="263.3" y1="486.6" x2="277.3" y2="482.6" stroke="#F2A33A" stroke-width="5.0" stroke-linecap="round"/><circle cx="263.3" cy="486.6" r="6.0" fill="#1E4752"/></g><circle cx="170.0" cy="526.0" r="9.0" fill="#1E4752"/></g><g class="a7"><text x="170.0" y="600.0" font-size="16" fill="#2E8B57" font-weight="700" text-anchor="middle">moving</text></g><g class="a8"><text x="170.0" y="600.0" font-size="16" fill="#D64535" font-weight="700" text
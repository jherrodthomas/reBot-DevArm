<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t-iso-13850 d-iso-13850" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-13850">Press, stop, stay stopped, reset, then restart on purpose</title><desc id="d-iso-13850">An emergency-stop device, a red mushroom head on a yellow background, beside a desktop arm, and five steps. 1 Press: anyone, one action, a device in easy reach. 2 Stop: it overrides every other function, as a stop of category 0 or 1. 3 Stay stopped: the device latches until it is reset by hand. 4 Reset the device: resetting does not start the machine. 5 Restart: only a separate, deliberate start command moves it again. The animation presses the head, the arm stops and stays stopped through the reset, and moves again only after the start command.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.25%{opacity:0}3.44%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a1{animation:a1 16s linear infinite;}@keyframes a2{0.00%{opacity:1}6.25%{opacity:1}7.81%{opacity:0}45.00%{opacity:0}46.56%{opacity:1}100.00%{opacity:1}}.a2{animation:a2 16s linear infinite;}@keyframes a3{0.00%{opacity:0}6.25%{opacity:0}7.81%{opacity:1}45.00%{opacity:1}46.56%{opacity:0}100.00%{opacity:0}}.a3{animation:a3 16s linear infinite;opacity:0;}@keyframes a4{0%,31.25%{opacity:0}33.44%,45.00%{opacity:1}47.19%,100%{opacity:0}}.a4{animation:a4 16s linear infinite;opacity:0;}@keyframes a5{0%{transform:rotate(0.0deg)}0.00%{transform:rotate(0.0deg)}3.75%{transform:rotate(-14.0deg)}7.50%{transform:rotate(0.0deg)}18.75%{transform:rotate(0.0deg)}62.50%{transform:rotate(0.0deg)}67.50%{transform:rotate(-14.0deg)}72.50%{transform:rotate(0.0deg)}77.50%{transform:rotate(-14.0deg)}100%{transform:rotate(-14.0deg)}}.a5{animation:a
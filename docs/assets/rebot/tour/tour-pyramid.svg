<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t-tour-pyramid d-tour-pyramid" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-tour-pyramid">How machinery standards stack: types A, B and C</title><desc id="d-tour-pyramid">A pyramid built from the bottom: type A, ISO 12100, basic concepts for every machine; type B, one safety aspect or one kind of safeguard (ISO 13849-1 and -2, EN 60204-1, ISO 13850, ISO 13854, ISO 13855, ISO 13857); type C, one kind of machine, ISO 10218-1 and -2 for industrial robots with ISO/TS 15066. An arrow marks the tiers as more specific towards the top; where a type C standard differs from A or B, type C governs. Beside it the standards outside the pyramid: functional safety, analysis methods, cybersecurity and AI, the safety case and process capability, and the law.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,67.14%{opacity:0}69.64%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a1{animation:a1 14s linear infinite;}@keyframes a2{0%,2.86%{opacity:0}5.36%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a2{animation:a2 14s linear infinite;}@keyframes a3{0%,14.29%{opacity:0}16.79%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a3{animation:a3 14s linear infinite;}@keyframes a4{0%,25.71%{opacity:0}28.21%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a4{animation:a4 14s linear infinite;}@keyframes a5{0%,38.57%{opacity:0}41.07%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a5{animation:a5 14s linear infinite;}@keyframes a6{0%,45.71%{opacity:0}48.21%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a6{animation:a6 14s linear infinite;}@keyframes a7{0%,48.57%{opacity:0}51.07%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a7{animation:a7 14s linear infinite;}@keyframes a8{0%,51.79%{opacity:0}54.29%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a8{animation:a8 14s linear infinite;}@keyframes a9{0%,55.00%{opacity:0}57.50%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a9{animation:a9 14s linear infinite;}@keyframes a10{0%,58.21%{opacity:0}60.71%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a10{animation:a10 14s linear infinite;}@keyframes a11{0%,61.43%{opacity:0}63.93%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a11{animation:a11 14s linear infinite;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.0" y="0.0" width="960.0" height="580.0" rx="0" fill="#FFFFFF"/><text x="28.0" y="34.0" font-size="14" fill="#4E6A73" font-weight="700" text-anchor="start" letter-spacing="1.2">STANDARDS TOUR</text><text x="28.0" y="66.0" font-size="26" fill="#122026" font-weight="700" text-anchor="start">How machinery standards stack: types A, B and C</text><g class="a1"><text x="320.0" y="112.0" font-size="15.5" fill="#4E6A73" font-weight="400" text-anchor="middle">Where a type C standard differs from A or B, type C governs (to be checked)</text></g><g class="a2"><path d="M20,520 L620,520 L560,402 L80,402 Z" stroke="none" stroke-width="0" fill="#1E4752" stroke-linecap="round" stroke-linejoin="round"/><text x="320.0" y="438.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">Type A · basic concepts</text><text x="320.0" y="466.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">ISO 12100: every machine</text></g><g class="a3"><path d="M80,396 L560,396 L500,278 L140,278 Z" stroke="none" stroke-width="0" fill="#5F8F99" stroke-linecap="round" stroke-linejoin="round"/><text x="320.0" y="314.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">Type B · aspects and safeguards</text><text x="320.0" y="342.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">ISO 13849-1/-2 · EN 60204-1 · ISO 13850</text><text x="320.0" y="362.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">· ISO 13854 · ISO 13855 · ISO 13857</text></g><g class="a4"><path d="M140,272 L500,272 L440,154 L200,154 Z" stroke="none" stroke-width="0" fill="#F2A33A" stroke-linecap="round" stroke-linejoin="round"/><text x="320.0" y="190.0" font-size="19" fill="#122026" font-weight="700" text-anchor="middle">Type C · one kind of machine</text><text x="320.0" y="218.0" font-size="16" fill="#122026" font-weight="400" text-anchor="middle">ISO 10218-1/-2,</text><text x="320.0" y="238.0" font-size="16" fill="#122026" font-weight="400" text-anchor="middle">industrial robots, with</text><text x="320.0" y="258.0" font-size="16" fill="#122026" font-weight="400" text-anchor="middle">ISO/TS 15066</text></g><g class="a5"><line x1="648.0" y1="500.0" x2="648.0" y2="168.0" stroke="#4E6A73" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><text x="636" y="334" font-size="16" fill="#4E6A73" font-weight="700" text-anchor="middle" transform="rotate(-90 636 334)">more specific</text></g><g class="a6"><text x="676.0" y="150.0" font-size="18" fill="#122026" font-weight="700" text-anchor="start">Beside the pyramid</text></g><g class="a7"><rect x="676.0" y="172.0" width="272.0" height="58.0" rx="10" fill="#F4F3EF"/><text x="688.0" y="196.0" font-size="16" fill="#4E6A73" font-weight="700" text-anchor="start">Functional safety</text><text x="688.0" y="219.0" font-size="15" fill="#122026" font-weight="600" text-anchor="start">IEC 61508 · IEC 62061</text></g><g class="a8"><rect x="676.0" y="240.0" width="272.0" height="58.0" rx="10" fill="#F4F3EF"/><text x="688.0" y="264.0" font-size="16" fill="#4E6A73" font-weight="700" text-anchor="start">Analysis methods</text><text x="688.0" y="287.0" font-size="15" fill="#122026" font-weight="600" text-anchor="start">IEC 60812 · IEC 61025 · ISO 21448</text></g><g class="a9"><rect x="676.0" y="308.0" width="272.0" height="58.0" rx="10" fill="#F4F3EF"/><text x="688.0" y="332.0" font-size="16" fill="#4E6A73" font-weight="700" text-anchor="start">New kinds of risk</text><text x="688.0" y="355.0" font-size="15" fill="#122026" font-weight="600" text-anchor="start">IEC 62443 · ISO/IEC TR 5469</text></g><g class="a10"><rect x="676.0" y="376.0" width="272.0" height="58.0" rx="10" fill="#F4F3EF"/><text x="688.0" y="400.0" font-size="16" fill="#4E6A73" font-weight="700" text-anchor="start">Argument and process</text><text x="688.0" y="423.0" font-size="15" fill="#122026" font-weight="600" text-anchor="start">UL 4600 · Automotive SPICE</text></g><g class="a11"><rect x="676.0" y="444.0" width="272.0" height="58.0" rx="10" fill="#F4F3EF"/><text x="688.0" y="468.0" font-size="16" fill="#4E6A73" font-weight="700" text-anchor="start">Law, not a standard</text><text x="688.0" y="491.0" font-size="15" fill="#122026" font-weight="600" text-anchor="start">Machinery Regulation · AI Act</text></g><text x="480.0" y="566.0" font-size="12.5" fill="#4E6A73" font-weight="400" text-anchor="middle">Explains the standard's idea, not a claim about the arm · clause references to be checked · tools/wiki/tour_figures.py</text></svg>

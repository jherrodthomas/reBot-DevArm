<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t-iso-13854 d-iso-13854" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iso-13854">Leave room for the body part, or none at all</title><desc id="d-iso-13854">A fixed part and a moving part close the gap between them. Beside them, the minimum gaps the record's hazard scenes use: 500 mm avoids crushing the body, 120 mm avoids crushing the arm, 100 mm avoids crushing the hand, 25 mm avoids crushing the finger. As the gap closes past each value the row turns from safe to can be crushed. Values are read from the record's scenes.yaml; the standard lists more body parts.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.43%{opacity:0}3.93%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a1{animation:a1 14s linear infinite;}@keyframes a2{0%{transform:translate(0.0px,0.0px)}5.71%{transform:translate(0.0px,0.0px)}18.57%{transform:translate(-120.0px,0.0px)}32.86%{transform:translate(-200.0px,0.0px)}45.71%{transform:translate(-240.0px,0.0px)}60.00%{transform:translate(-300.0px,0.0px)}71.43%{transform:translate(-330.0px,0.0px)}100%{transform:translate(-330.0px,0.0px)}}.a2{animation:a2 14s linear infinite;transform:translate(-160.0px,0.0px);}@keyframes a3{0%,2.86%{opacity:0}5.36%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a3{animation:a3 14s linear infinite;}@keyframes a4{0%,2.86%{opacity:0}5.36%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a4{animation:a4 14s linear infinite;}@keyframes a5{0%,4.29%{opacity:0}6.79%,94.29%{opacity:1}96.79%,100%{opacity:0}}.a5{animation:a5 14s linear infinite;}@keyframes a6{0.00%{opacity:0}6.43%{opacity:0}8.21%{opacity:1}18.57%{opacity:1}20.36%{opacity:0}100.00%{opacity:0}}.a6{animation:a6 14s linear infinite;opacity:0;}@keyframes a
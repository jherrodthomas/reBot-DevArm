<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t-aspice d-aspice" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-aspice">Six capability levels, each built on the one below</title><desc id="d-aspice">A staircase of the six capability levels: CL0 incomplete, the process does not achieve its purpose; CL1 performed, the outcomes are achieved; CL2 managed, planned, monitored and with work products controlled; CL3 established, a defined standard process is used; CL4 predictable, measured and controlled in numbers; CL5 innovating, improved continuously. Each level adds process attributes, rated not, partly, largely or fully achieved.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,2.67%{opacity:0}5.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a1{animation:a1 15s linear infinite;}@keyframes a2{0%,4.67%{opacity:0}7.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a2{animation:a2 15s linear infinite;}@keyframes a3{0%,13.33%{opacity:0}15.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a3{animation:a3 15s linear infinite;}@keyframes a4{0%,15.33%{opacity:0}17.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a4{animation:a4 15s linear infinite;}@keyframes a5{0%,24.00%{opacity:0}26.33%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a5{animation:a5 15s linear infinite;}@keyframes a6{0%,26.00%{opacity:0}28.33%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a6{animation:a6 15s linear infinite;}@keyframes a7{0%,34.67%{opacity:0}37.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a7{animation:a7 15s linear infinite;}@keyframes a8{0%,36.67%{opacity:0}39.00%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a8{animation:a8 15s linear infinite;}@keyframes a9{0%,45.33%{opacity:0}47.67%,94.67%{opacity:1}97.00%,100%{opacity:0}}.a9{animation:a9 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t-iec-60812 d-iec-60812" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t-iec-60812">FMEA: how can it fail, what happens, what catches it</title><desc id="d-iec-60812">One row of an FMEA worksheet built step by step, as an illustration of the method: the function, remove motor power when the E-stop is pressed; the failure mode, a contactor welds closed; the effect, power stays on and the arm can keep moving, rated for severity S; the cause, overload or end of life, rated for occurrence O; the current control, its mirror contact checked before each start, rated for detection D. S, O and D give the priority, by a risk priority number or another scheme the 2018 edition allows; an action follows and the row is rated again.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6A73"/></marker></defs><style>@keyframes a1{0%,1.25%{opacity:0}3.44%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a1{animation:a1 16s linear infinite;}@keyframes a2{0%,3.12%{opacity:0}5.31%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a2{animation:a2 16s linear infinite;}@keyframes a3{0%,8.75%{opacity:0}10.94%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a3{animation:a3 16s linear infinite;}@keyframes a4{0%,8.75%{opacity:0}10.94%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a4{animation:a4 16s linear infinite;}@keyframes a5{0%,14.37%{opacity:0}16.56%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a5{animation:a5 16s linear infinite;}@keyframes a6{0%,14.37%{opacity:0}16.56%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a6{animation:a6 16s linear infinite;}@keyframes a7{0%,20.00%{opacity:0}22.19%,95.00%{opacity:1}97.19%,100%{opacity:0}}.a7{animation:a7 16s linear infinite;}@keyframes a8{0%,25.62%{opacity:0}27.81%,95.00%{opacity:1}97.19%,100%{opacity:0}
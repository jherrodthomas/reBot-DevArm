name: Problem report
description: A defect, an anomaly during testing, or a finding against a work product (WP-P-03 problem resolution)
labels: ["problem", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for development, review and test findings.
        **Security vulnerabilities:** do not open a public issue. Use the private report link on the
        "New issue" page instead.
        **Injury or property damage:** make everyone safe first, then file this report and tick the last box.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety triage
      description: Tick every box that applies. Any ticked box makes this a safety anomaly, triaged within one working day, and stops testing until the safety manager lifts the stop (WP-M-02 §9, WP-V-07 §6).
      options:
        - label: Unexpected or uncommanded motion occurred
        - label: A stop (E-stop, protective stop, watchdog) did not happen or was late
        - label: A pre-session check of WP-V-07 failed
        - label: The arm touched a person or an object, or someone was hurt

  - type: dropdown
    id: configuration
    attributes:
      label: Configuration
      options:
        - B601-DM v1.1 with the bench safety chain fitted (reference configuration, CFG-001)
        - B601-DM v1.1 without the bench safety chain (outside the hold point)
        - B601-RS (CFG-002, unverified)
        - Simulation / bench / CI only
        - Other (say which in the description)
    validations:
      required: true

  - type: input
    id: baseline
    attributes:
      label: Baseline
      description: Commit or tag of this record and the versions of the SDK, driver and policy checkpoint involved.
      placeholder: reBot-DevArm@206ebda, motorbridge <version>, ROS 2 driver <commit>
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What happened, what you expected, and how to reproduce it. For a finding against a work product, name the work product and section.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, the test log entry, photos, the SDK and driver versions, the supply voltage, the payload.
